name: Bug
description: Something synoptic or Cortext does wrong. Write it so an agent can reproduce it without asking.
labels: [fix]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What you saw, including the full error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: The smallest steps, frame or script that show it. Use example data, never real records.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The Cortext plugin version, and `substrate --version` if it involves the server.
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: Harness
      options:
        - Claude Code
        - Codex
        - OpenCode
        - Not relevant
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Log lines around the failure, if you have them.
      render: text
